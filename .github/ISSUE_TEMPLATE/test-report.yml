name: Test report
description: Share the result of `writehawk selftest` from your PC, especially on Windows 10.
title: "Test report: "
labels: ["test report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Every report from a different Windows version or graphics card tells us something we cannot test ourselves.
        Run this in a terminal and paste everything it prints below:

        ```
        python -m writehawk selftest
        ```

        For the two checks that need it, run the same command once more from a terminal opened with **Run as administrator**, and paste that too.
        The output names your Windows build and nothing that identifies your PC.
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 10
        - Windows 11
        - Windows Server
        - Not sure
    validations:
      required: true
  - type: textarea
    id: selftest
    attributes:
      label: Output of `python -m writehawk selftest`
      render: text
    validations:
      required: true
  - type: textarea
    id: selftest-admin
    attributes:
      label: Same command, from an administrator terminal (optional)
      render: text
  - type: textarea
    id: scan
    attributes:
      label: Output of `python -m writehawk scan` (optional)
      description: Useful when you have an NVIDIA or AMD graphics card. Paths in the output can contain your user name; remove it if you prefer.
      render: text
